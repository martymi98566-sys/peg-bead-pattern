<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>拼豆图纸生成器</title>
  <style>
    :root { color-scheme: light; --ink:#202531; --muted:#667085; --line:#d7dce5; --panel:#fff; --accent:#2563eb; }
    * { box-sizing:border-box; }
    body { margin:0; min-width:320px; background:#f3f5f9; color:var(--ink); font:15px/1.45 system-ui,"Microsoft YaHei",sans-serif; }
    header { padding:26px max(24px, calc((100vw - 1200px)/2)); background:linear-gradient(120deg,#172554,#2563eb); color:#fff; }
    h1 { margin:0; font-size:27px; } header p { margin:5px 0 0; opacity:.88; }
    main { max-width:1200px; margin:24px auto; padding:0 20px; display:grid; grid-template-columns:300px 1fr; gap:20px; }
    .card { background:var(--panel); border:1px solid #e4e7ec; border-radius:14px; box-shadow:0 2px 8px #1018280a; }
    aside { padding:18px; align-self:start; position:sticky; top:16px; }
    h2 { font-size:16px; margin:0 0 13px; } label { display:block; margin:14px 0 5px; font-weight:650; }
    input, select, button { font:inherit; } input[type=number], select { width:100%; padding:8px 9px; border:1px solid var(--line); border-radius:8px; background:#fff; }
    input[type=file] { width:100%; font-size:13px; }
    .dimensions { display:grid; grid-template-columns:1fr 20px 1fr; gap:7px; align-items:end; } .times { padding-bottom:9px; text-align:center; color:var(--muted); }
    .checks { display:grid; gap:7px; margin-top:13px; } .checks label { margin:0; font-weight:400; display:flex; gap:8px; align-items:center; }
    button { cursor:pointer; border:0; border-radius:8px; padding:10px 12px; font-weight:700; } button.primary { width:100%; margin-top:17px; background:var(--accent); color:#fff; } button.secondary { background:#e8eefc; color:#164bb2; }
    .hint { margin:13px 0 0; color:var(--muted); font-size:13px; }
    section.card { padding:18px; min-width:0; } .empty { min-height:530px; display:grid; place-items:center; text-align:center; color:var(--muted); }
    #result[hidden], #empty[hidden] { display:none; } .toolbar { display:flex; justify-content:space-between; gap:10px; flex-wrap:wrap; margin-bottom:14px; align-items:center; }
    #summary { color:var(--muted); } #canvasWrap { overflow:auto; max-height:65vh; border:1px solid var(--line); border-radius:9px; background:#fafafa; padding:12px; }
    canvas { display:block; margin:auto; image-rendering:pixelated; background:#fff; } .legend { margin-top:16px; display:grid; grid-template-columns:repeat(auto-fill,minmax(155px,1fr)); gap:7px; }
    .swatch { display:flex; align-items:center; gap:8px; min-width:0; } .dot { width:19px; height:19px; flex:none; border:1px solid #667085; border-radius:50%; } .swatch span { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    @media (max-width:750px) { main { grid-template-columns:1fr; } aside { position:static; } .empty { min-height:250px; } }
  </style>
</head>
<body>
  <header><h1>拼豆图纸生成器</h1><p>上传图片，设置横向 m 与纵向 n，生成可打印的像素拼豆图纸。</p></header>
  <main>
    <aside class="card">
      <h2>图纸设置</h2>
      <label for="file">图片</label><input id="file" type="file" accept="image/*" />
      <label>成品尺寸（m × n）</label>
      <div class="dimensions"><input id="cols" type="number" min="1" max="200" value="30" aria-label="横向 m" /><b class="times">×</b><input id="rows" type="number" min="1" max="200" value="30" aria-label="纵向 n" /></div>
      <label for="palette">最多使用 MARD 色号</label><select id="palette"><option value="8">8 色</option><option value="12" selected>12 色</option><option value="16">16 色</option><option value="24">24 色</option><option value="32">32 色</option></select>
      <div class="checks"><label><input id="grid" type="checkbox" checked /> 显示网格线</label><label><input id="symbols" type="checkbox" checked /> 显示 MARD 色号（图纸较小时）</label></div>
      <button id="generate" class="primary">生成图纸</button>
      <p class="hint">m 为横向豆子数，n 为纵向豆子数。颜色会匹配到 MARD 221 标准实体色号；屏幕色仅供参考。</p>
    </aside>
    <section class="card">
      <div id="empty" class="empty"><div><h2>等待上传图片</h2><p>选择一张 JPG、PNG、WebP 或 GIF 图片开始。</p></div></div>
      <div id="result" hidden>
        <div class="toolbar"><div><h2>生成结果</h2><div id="summary"></div></div><button id="download" class="secondary">下载 PNG 图纸</button></div>
        <div id="canvasWrap"><canvas id="canvas"></canvas></div><div id="legend" class="legend"></div>
      </div>
    </section>
  </main>
  <script>
    const $ = id => document.getElementById(id); let source = null, last = null;
    const clamp = (v,a,b) => Math.max(a,Math.min(b,v));
    function readSettings() { return { cols:clamp(+$('cols').value||30,1,200), rows:clamp(+$('rows').value||30,1,200), count:+$('palette').value, grid:$('grid').checked, symbols:$('symbols').checked }; }
    // MARD 221 standard palette: A–H and M series. HEX is a screen reference;
    // the code is the one used when buying and placing real beads.
    const MARD221=Object.entries({
      A:'FAF4C8,FFFFD5,FEFF8B,FBED56,F4D738,FEAC4C,FE8B4C,FFDA45,FF995B,F77C31,FFDD99,FE9F72,FFC365,FD543D,FFF365,FFFF9F,FFE36E,FEBE7D,FD7C72,FFD568,FFE395,F4F57D,E6C9B7,F7F8A2,FFD67D,FFC830',
      B:'E6EE31,63F347,9EF780,5DE035,35E352,65E2A6,3DAF80,1C9C4F,27523A,95D3C2,5D722A,166F41,CAEB7B,ADE946,2E5132,C5ED9C,9BB13A,E6EE49,24B88C,C2F0CC,156A6B,0B3C43,303A21,EEFCA5,4E846D,8D7A35,CCE1AF,9EE5B9,C5E254,E2FCB1,B0E792,9CAB5A',
      C:'E8FFE7,A9F9FC,A0E2FB,41CCFF,01ACEB,50AAF0,3677D2,0F54C0,324BCA,3EBCE2,28DDDE,1C334D,CDE8FF,D5FDFF,22C4C6,1557A8,04D1F6,1D3344,1887A2,176DAF,BEDDFF,67B4BE,C8E2FF,7CC4FF,A9E5E5,3CAED8,D3DFFA,BBCFED,34488E',
      D:'AEB4F2,858EDD,2F54AF,182A84,B843C5,AC7BDE,8854B3,E2D3FF,D5B9F8,361851,B9BAE1,DE9AD4,B90095,8B279B,2F1F90,E3E1EE,C4D4F6,A45EC7,D8C3D7,9C32B2,9A009B,333A95,EBDAFC,7786E5,494FC7,DFC2F8',
      E:'FDD3CC,FEC0DF,FFB7E7,E8649E,F551A2,F13D74,C63478,FFDBE9,E970CC,D33793,FCDDD2,F78FC3,B5006D,FFD1BA,F8C7C9,FFF3EB,FFE2EA,FFC7DB,FEBAD5,D8C7D1,BD9DA1,B785A1,937A8D,E1BCE8',
      F:'FD957B,FC3D46,F74941,FC283C,E7002F,943630,971937,BC0028,E2677A,8A4526,5A2121,FD4E6A,F35744,FFA9AD,D30022,FEC2A6,E69C79,D37C46,C1444A,CD9391,F7B4C6,FDC0D0,F67E66,E698AA,E54B4F',
      G:'FFE2CE,FFC4AA,F4C3A5,E1B383,EDB045,E99C17,9D5B3E,753832,E6B483,D98C39,E0C593,FFC890,B7714A,8D614C,FCF9E0,F2D9BA,78524B,FFE4CC,E07935,A94023,B88558',
      H:'FDFBFF,FEFFFF,B6B1BA,89858C,48464E,2F2B2F,000000,E7D6DB,EDEDED,EEE9EA,CECDD5,FFF5ED,F5ECD2,CFD7D3,98A6A8,1D1414,F1EDED,FFFDF0,F6EFE2,949FA3,FFFBE1,CACAD4,9A9D94',
      M:'BCC6B8,8AA386,697D80,E3D2BC,D0CCAA,B0A782,B4A497,B38281,A58767,C5B2BC,9F7594,644749,D19066,C77362,757D78'
    }).flatMap(([series,hexes])=>hexes.split(',').map((v,i)=>({code:`${series}${i+1}`,hex:`#${v}`,rgb:[parseInt(v.slice(0,2),16),parseInt(v.slice(2,4),16),parseInt(v.slice(4,6),16)]})));
    function rgbName([r,g,b]) { return `RGB(${r}, ${g}, ${b})`; }
    // Median-cut quantization: turns arbitrary source pixels into a compact, reproducible palette.
    function medianCut(pixels, wanted) {
      // `sort()` mutates its array. Work on a shallow copy so that `pixels`
      // still retains the original left-to-right, top-to-bottom image layout.
      let boxes=[pixels.slice()];
      while(boxes.length<wanted) { let bi=-1, score=-1; boxes.forEach((box,i)=>{ if(box.length<2)return; let range=Math.max(...[0,1,2].map(k=>Math.max(...box.map(p=>p[k]))-Math.min(...box.map(p=>p[k])))); if(range>score){score=range;bi=i;} }); if(bi<0) break;
        const box=boxes.splice(bi,1)[0], ranges=[0,1,2].map(k=>Math.max(...box.map(p=>p[k]))-Math.min(...box.map(p=>p[k]))), channel=ranges.indexOf(Math.max(...ranges)); box.sort((a,b)=>a[channel]-b[channel]); const mid=Math.floor(box.length/2); boxes.push(box.slice(0,mid),box.slice(mid)); }
      return boxes.map(box=>[0,1,2].map(k=>Math.round(box.reduce((s,p)=>s+p[k],0)/box.length)));
    }
    function nearest(c,palette) { let best=0, d=Infinity; palette.forEach((p,i)=>{const rgb=p.rgb||p, n=(c[0]-rgb[0])**2+(c[1]-rgb[1])**2+(c[2]-rgb[2])**2;if(n<d){d=n;best=i;}});return best; }
    function pickMardPalette(pixels,wanted) {
      // First describe the image with median-cut, then snap each description to
      // a real MARD bead. Using more candidates prevents duplicate MARD codes.
      const candidates=medianCut(pixels,Math.min(pixels.length,wanted*4)), chosen=[];
      for(const color of candidates) { const bead=MARD221[nearest(color,MARD221)]; if(!chosen.some(x=>x.code===bead.code)) chosen.push(bead); if(chosen.length===wanted) break; }
      return chosen;
    }
    function makePattern() {
      if(!source) return alert('请先上传一张图片。'); const s=readSettings(); $('cols').value=s.cols; $('rows').value=s.rows;
      const small=document.createElement('canvas'); small.width=s.cols; small.height=s.rows; const x=small.getContext('2d');
      const scale=Math.max(s.cols/source.width,s.rows/source.height), w=source.width*scale, h=source.height*scale; x.drawImage(source,(s.cols-w)/2,(s.rows-h)/2,w,h);
      const raw=x.getImageData(0,0,s.cols,s.rows).data, pixels=[]; for(let i=0;i<raw.length;i+=4) pixels.push([raw[i],raw[i+1],raw[i+2]]);
      const palette=pickMardPalette(pixels,s.count), cells=pixels.map(p=>nearest(p,palette)); last={s,palette,cells}; draw();
    }
    function draw() { if(!last)return; const {s,palette,cells}=last, cell=clamp(Math.floor(720/Math.max(s.cols,s.rows)),10,28), c=$('canvas'), ctx=c.getContext('2d'); c.width=s.cols*cell; c.height=s.rows*cell; ctx.imageSmoothingEnabled=false;
      for(let y=0;y<s.rows;y++) for(let x=0;x<s.cols;x++){ const i=cells[y*s.cols+x], p=palette[i], rgb=p.rgb; ctx.fillStyle=p.hex;ctx.fillRect(x*cell,y*cell,cell,cell); if(s.symbols && cell>=13){ctx.fillStyle=(rgb[0]*.299+rgb[1]*.587+rgb[2]*.114)>145?'#111':'#fff';ctx.font=`bold ${Math.max(8,cell*.42)}px sans-serif`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(p.code,x*cell+cell/2,y*cell+cell/2);} }
      if(s.grid){ctx.strokeStyle='rgba(20,25,35,.45)';ctx.lineWidth=1;ctx.beginPath();for(let x=0;x<=s.cols;x++){ctx.moveTo(x*cell+.5,0);ctx.lineTo(x*cell+.5,c.height)}for(let y=0;y<=s.rows;y++){ctx.moveTo(0,y*cell+.5);ctx.lineTo(c.width,y*cell+.5)}ctx.stroke();}
      const counts=palette.map((_,i)=>cells.filter(v=>v===i).length); $('summary').textContent=`${s.cols} × ${s.rows} 格 · 共 ${s.cols*s.rows} 颗拼豆 · MARD 221 实际使用 ${counts.filter(Boolean).length} 个色号`;
      $('legend').innerHTML=palette.map((p,i)=>counts[i]?`<div class="swatch"><i class="dot" style="background:${p.hex}"></i><span>${p.code} · ${counts[i]} 颗 · ${p.hex}</span></div>`:'').join(''); $('empty').hidden=true;$('result').hidden=false;
    }
    $('file').addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;const url=URL.createObjectURL(f);source=new Image();source.onload=()=>{URL.revokeObjectURL(url);makePattern()};source.src=url;});
    $('generate').onclick=makePattern; ['grid','symbols'].forEach(id=>$(id).onchange=draw);
    $('download').onclick=()=>{if(!last)return;const a=document.createElement('a');a.download=`拼豆图纸_${last.s.cols}x${last.s.rows}.png`;a.href=$('canvas').toDataURL('image/png');a.click();};
  </script>
</body>
</html>
